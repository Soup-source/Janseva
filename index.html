<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>JanSeva | Scheme Eligibility Navigator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#D9731A">
<meta name="application-name" content="JanSeva">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JanSeva">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4F8; --panel:#FFFFFF; --ink:#16213E; --muted:#58637A; --line:#DCE1EB;
  --saffron:#D9731A; --saffron-ink:#FFFFFF; --green:#16794C; --green-bg:#E3F2EA;
  --red:#A6342B; --red-bg:#FBEAE8; --focus:#2557D6;
  --sf:"Segoe UI"; --lh:1.55; --hlh:1.12;
  --display:"Bricolage Grotesque",var(--sf),system-ui,sans-serif;
  --body:"Mukta",var(--sf),system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --panel:#172036; --ink:#EAEEF7; --muted:#9CA8C2; --line:#2A3452;
    --saffron:#F0903A; --saffron-ink:#1A1206; --green:#58C48E; --green-bg:#13301F;
    --red:#F0897F; --red-bg:#3A1C1A; --focus:#7FA3FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --panel:#172036; --ink:#EAEEF7; --muted:#9CA8C2; --line:#2A3452;
  --saffron:#F0903A; --saffron-ink:#1A1206; --green:#58C48E; --green-bg:#13301F;
  --red:#F0897F; --red-bg:#3A1C1A; --focus:#7FA3FF;
}
:root[data-ind="1"]{--lh:1.75;--hlh:1.4}
:root[lang="ur"]{--lh:2.05;--hlh:1.6}
html{scroll-padding-top:calc(12px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:var(--lh)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.tricolor{height:5px;background:linear-gradient(90deg,#E8832A 0 33.3%,#fff 33.3% 66.6%,#1E8A55 66.6%)}

/* top bar */
.bar{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--saffron);color:var(--saffron-ink);display:grid;place-items:center;font-size:1.1rem;line-height:1}
.tools{display:flex;gap:8px;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;cursor:pointer;font-weight:600}
.tbtn:hover{border-color:var(--ink)}
.tbtn.icon{width:42px;padding:0;justify-content:center}
.tbtn svg{flex:none}
.langwrap{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;width:min(400px,calc(100vw - 32px));display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:70vh;overflow:auto}
.menu[hidden]{display:none}
.lopt{display:flex;flex-direction:column;align-items:flex-start;text-align:start;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;line-height:1.3}
.lopt:hover{background:var(--bg)}
.lopt[aria-current="true"]{background:var(--ink);color:var(--bg)}
.lopt .ln{font-weight:600;font-size:1.05rem}
.lopt .le{font-size:.78rem;opacity:.75}

/* hero */
.hero{max-width:1180px;margin:0 auto;padding:26px 20px 8px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4.2vw,2.8rem);line-height:var(--hlh);letter-spacing:-.02em;max-width:26ch;text-wrap:balance}
.privacy{display:inline-flex;align-items:center;gap:10px;margin-top:16px;background:var(--green-bg);color:var(--green);border-radius:999px;padding:8px 16px 8px 12px;font-weight:600;font-size:.95rem;line-height:1.3}
.privacy svg{flex:none}

/* layout */
main{max-width:1180px;margin:0 auto;padding:18px 20px 56px;display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:28px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr;padding-bottom:96px}}

/* profile panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:860px){.panel{position:static;max-height:none}}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h2{font-family:var(--display);font-size:1.3rem;line-height:var(--hlh)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:36px;padding:0 4px}
.link:hover{color:var(--ink)}
.hint{color:var(--muted);font-size:.92rem;margin:4px 0 6px}
.fld{margin-top:18px}
.lbl{display:block;font-weight:600;font-size:.95rem;margin-bottom:7px}
.stepper{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{width:52px;border:0;background:transparent;font-size:1.4rem;cursor:pointer}
.stepper button:hover{background:var(--line)}
.stepper input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font:inherit;font-size:1.2rem;font-weight:600;color:var(--ink);padding:10px 0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:48px}
.seg{display:flex;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg .opt{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-weight:600;font-size:.95rem;line-height:1.3}
.seg input:checked + span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible + span{outline:3px solid var(--focus);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:block;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:.95rem;line-height:1.35}
.chips input:hover + span{border-color:var(--ink)}
.chips input:checked + span{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink);font-weight:600}
.chips input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.incrow{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:0 14px}
.incrow b{font-size:1.2rem;color:var(--muted)}
.incrow input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.25rem;font-weight:600;color:var(--ink);padding:10px 0;-moz-appearance:textfield}
.incrow input::-webkit-outer-spin-button,.incrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.incfmt{color:var(--muted);font-size:.9rem;white-space:nowrap}
input[type=range]{width:100%;margin:12px 0 0;accent-color:var(--saffron);height:28px}
fieldset{border:0;border-top:1px solid var(--line);margin:20px 0 0;padding:12px 0 0}
legend{font-weight:600;padding:0 8px 0 0;font-size:.95rem}
.sw{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:9px 0;cursor:pointer;position:relative;line-height:1.35}
.sw input{position:absolute;opacity:0;width:44px;height:26px;inset-inline-end:0;margin:0}
.sw i{flex:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked + i{background:var(--green)}
.sw input:checked + i::after{transform:translateX(18px)}
[dir="rtl"] .sw input:checked + i::after{transform:translateX(-18px)}
.sw input:focus-visible + i{outline:3px solid var(--focus);outline-offset:2px}

/* results */
#results{min-width:0}
.summary{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.seal{width:108px;height:108px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-content:center;text-align:center;position:relative;transform:rotate(-4deg);line-height:1}
.seal::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed var(--ink);opacity:.5}
.seal b{font-family:var(--display);font-size:2.7rem;line-height:1}
.seal span{font-size:.85rem;color:var(--muted);margin-top:2px}
.seal.pop{animation:pop .4s ease}
@keyframes pop{40%{transform:rotate(-4deg) scale(1.09)}}
.seal.zero{border-color:var(--muted);color:var(--muted)}
.summary h2{font-family:var(--display);font-size:clamp(1.25rem,2.6vw,1.7rem);line-height:var(--hlh)}
.summary p{color:var(--muted);margin-top:4px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs{display:inline-flex;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .cnt{font-size:.8rem;border-radius:999px;padding:0 8px;background:var(--line);color:var(--ink);line-height:1.6}
.tabs button[aria-selected="true"] .cnt{background:var(--bg);color:var(--ink)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.92rem;min-height:36px}
.fchips button:hover{border-color:var(--ink)}
.fchips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.eng{font-size:.88rem;color:var(--muted);margin:0 0 12px;padding:8px 12px;border-inline-start:3px solid var(--saffron);background:var(--panel);border-radius:6px}
.empty{color:var(--muted);padding:28px;border:2px dashed var(--line);border-radius:16px;text-align:center}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--green);border-radius:16px;margin-bottom:12px;overflow:hidden}
.chead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border:0;background:transparent;cursor:pointer;text-align:start}
.chead:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.cname{display:block;font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:var(--hlh)}
.ccat{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.cmeta{display:flex;align-items:center;gap:12px;flex:none}
.mode{background:var(--green-bg);color:var(--green);font-weight:600;font-size:.82rem;border-radius:999px;padding:2px 12px;white-space:nowrap}
.ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--green) var(--p,0deg),var(--line) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:4px;background:var(--panel);border-radius:50%}
.ring em{position:relative;font-style:normal;font-size:.68rem;font-weight:700}
.chev{transition:transform .25s;flex:none;color:var(--muted)}
.card.open .chev{transform:rotate(180deg)}
.cpanel{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .28s ease,visibility 0s linear .28s}
.card.open .cpanel{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .28s ease,visibility 0s}
.cin{overflow:hidden;min-height:0;padding:0 20px}
.card.open .cin{padding-bottom:20px}
.meets{color:var(--green);font-weight:600;font-size:.95rem;margin:2px 0 8px;display:flex;gap:8px;align-items:center}
.desc{margin:0 0 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.cols h4{font-family:var(--display);font-size:1rem;margin-bottom:6px}
.cols p{margin-bottom:12px}
.portal{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;border-radius:10px;padding:0 16px;min-height:44px}
.walkin{color:var(--muted);font-style:italic}
ul.docs{list-style:none;margin:0;padding:0}
ul.docs li{margin:0 0 8px}
ul.docs label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4;font-size:.96rem}
ul.docs input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green);flex:none}
ul.docs input:checked + span{text-decoration:line-through;color:var(--muted)}
.prog{font-size:.85rem;color:var(--muted);margin-top:4px}
.acts{display:flex;margin-top:12px}
.copybtn{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:0 14px;min-height:42px;cursor:pointer;font-weight:600}
.copybtn:hover{border-color:var(--ink)}
.note{font-size:.84rem;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.card.no{border-inline-start-color:var(--red)}
.row{padding:16px 20px}
.row .cname{margin-bottom:6px}
.why{display:inline-block;background:var(--red-bg);color:var(--red);border-radius:8px;padding:2px 12px;font-size:.95rem}
.whyno{color:var(--muted);margin:0 0 12px}

/* mobile bar */
.mbar{display:none}
@media(max-width:860px){
  .mbar{display:flex;justify-content:center;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 45%);transform:translateY(130%);visibility:hidden;pointer-events:none;transition:transform .28s ease,visibility 0s linear .28s}
  .mbar.show{transform:none;visibility:visible;pointer-events:auto;transition:transform .28s ease,visibility 0s}
  .mbar button{background:var(--saffron);color:var(--saffron-ink);border:0;border-radius:999px;padding:0 24px;min-height:50px;font-weight:600;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.25)}
}
footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.88rem}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="tricolor" aria-hidden="true"></div>

<div class="bar">
  <div class="brand"><span class="logo" aria-hidden="true">J</span><span>JanSeva</span></div>
  <div class="tools">
    <div class="langwrap">
      <button type="button" id="langBtn" class="tbtn" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
        <span id="langCur">English</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="langMenu" class="menu" hidden></div>
    </div>
    <button type="button" id="themeBtn" class="tbtn icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div>

<header class="hero">
  <h1 data-i18n="sub"></h1>
  <div class="privacy" role="note">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
    <span data-i18n="priv"></span>
  </div>
</header>

<main>
  <aside class="panel" id="profile">
    <div class="phead"><h2 data-i18n="prof"></h2><button type="button" class="link" id="reset" data-i18n="reset"></button></div>
    <p class="hint" data-i18n="profHint"></p>

    <div class="fld">
      <label class="lbl" for="age" data-i18n="age"></label>
      <div class="stepper" dir="ltr">
        <button type="button" id="ageM" aria-label="-">&minus;</button>
        <input id="age" type="number" min="1" max="110" step="1" inputmode="numeric">
        <button type="button" id="ageP" aria-label="+">+</button>
      </div>
    </div>

    <div class="fld">
      <span class="lbl" id="lGender" data-i18n="gender"></span>
      <div class="seg" id="gender" role="radiogroup" aria-labelledby="lGender"></div>
    </div>

    <div class="fld">
      <label class="lbl" for="state" data-i18n="state"></label>
      <select id="state"></select>
    </div>

    <div class="fld">
      <span class="lbl" id="lOcc" data-i18n="occ"></span>
      <div class="chips" id="occ" role="radiogroup" aria-labelledby="lOcc"></div>
    </div>

    <div class="fld">
      <span class="lbl" id="lArea" data-i18n="area"></span>
      <div class="seg" id="area" role="radiogroup" aria-labelledby="lArea"></div>
    </div>

    <div class="fld">
      <label class="lbl" for="income" data-i18n="inc"></label>
      <div class="incrow" dir="ltr"><b>₹</b><input id="income" type="number" min="0" max="3000000" step="10000" inputmode="numeric"><span class="incfmt" id="incfmt"></span></div>
      <input id="incomeR" type="range" min="0" max="3000000" step="10000" dir="ltr" aria-labelledby="lIncR">
      <span id="lIncR" hidden>Annual family income</span>
    </div>

    <fieldset>
      <legend data-i18n="decl"></legend>
      <label class="sw"><span data-i18n="tax"></span><input type="checkbox" id="tax"><i></i></label>
      <label class="sw"><span data-i18n="land"></span><input type="checkbox" id="land"><i></i></label>
      <label class="sw"><span data-i18n="lpg"></span><input type="checkbox" id="lpg"><i></i></label>
    </fieldset>
  </aside>

  <section id="results">
    <div class="summary">
      <div class="seal" id="seal"><b id="sealN">0</b><span id="sealT"></span></div>
      <div><h2 id="sumH" aria-live="polite"></h2><p id="sumP"></p></div>
    </div>
    <div class="ctrl">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="fchips" id="fchips" role="group"></div>
    </div>
    <p class="eng" id="engNote" hidden></p>
    <p class="whyno" id="whyNo" hidden></p>
    <div id="list"></div>
  </section>
</main>

 ui:{sub:"நீங்கள் தகுதி பெறக்கூடிய அரசுத் திட்டங்கள் எவை, விண்ணப்பிக்க என்ன கொண்டு செல்ல வேண்டும் என்பதை அறியுங்கள்.",priv:"பெயரோ அடையாள அட்டையோ கேட்கப்படாது. எதுவும் உங்கள் சாதனத்தை விட்டு வெளியே செல்லாது.",prof:"உங்கள் குடும்பச் சுயவிவரம்",profHint:"உங்களைப் பற்றியும் குடும்பத்தைப் பற்றியும் பதிலளியுங்கள். முடிவுகள் உடனுக்குடன் மாறும்.",age:"வயது (ஆண்டுகள்)",gender:"பாலினம்",state:"மாநிலம் / ஒன்றியப் பிரதேசம்",occ:"முக்கியத் தொழில்",area:"குடியிருப்புப் பகுதி",inc:"குடும்ப ஆண்டு வருமானம்",decl:"கூடுதல் அறிவிப்புகள்",tax:"குடும்பத்தில் வருமான வரி செலுத்துபவர் உள்ளார்",land:"குடும்பத்திற்குப் பயிரிடத் தகுந்த விவசாய நிலம் உள்ளது",lpg:"குடும்பத்திற்கு ஏற்கனவே செயலில் உள்ள எல்பிஜி இணைப்பு உள்ளது",reset:"மீட்டமை",allIndia:"அனைத்திந்திய / மத்திய",tabYes:"தகுதியானவை",tabNo:"தகுதியற்றவை",headN:"{t} திட்டங்களில் {n} உங்கள் சுயவிவரத்திற்குப் பொருந்துகின்றன",headNone:"இந்தச் சுயவிவரத்திற்கு எந்தத் திட்டமும் பொருந்தவில்லை",tick:"ஆவணங்களைச் சேகரிக்கச் சேகரிக்கக் குறியிடுங்கள்.",noneHint:"“தகுதியற்றவை” பகுதியில் காரணங்களைப் பாருங்கள். ஏதேனும் பதிலை மாற்றினால் முடிவு மாறலாம்.",how:"விண்ணப்பிப்பது எப்படி",docs:"தயாராக வைக்க வேண்டிய ஆவணங்கள்",ready:"{y} இல் {x} தயார்",portal:"அதிகாரப்பூர்வ இணையதளத்தைத் திறக்கவும்",walkin:"நேரில் சென்று பதிவு செய்வது மட்டுமே. ஆன்லைன் தளம் இல்லை.",copy:"சரிபார்ப்புப் பட்டியலை நகலெடு",copied:"நகலெடுக்கப்பட்டது",note:"வெளியிடப்பட்ட நிபந்தனைகளின் அடிப்படையிலான தொடக்கநிலைப் பொருத்தம். இறுதி ஒப்புதல் நிர்வாகப் பரிசீலனைக்கு உட்பட்டது.",eng:"திட்ட விவரங்கள் அரசு வெளியிட்ட ஆங்கிலத்திலேயே உள்ளன. பெயர்கள், விதிகள், காரணங்கள் மொழிபெயர்க்கப்பட்டுள்ளன.",foot:"விதிகள் நிலையான விதிமுறைத் தொகுப்பால் சரிபார்க்கப்படுகின்றன, செயற்கை நுண்ணறிவால் அல்ல; எனவே ஒரே பதில்களுக்கு எப்போதும் ஒரே முடிவு கிடைக்கும்.",fAll:"அனைத்தும்",show:"விண்ணப்ப முறை",open:"விவரங்கள்",viewBar:"{n} தகுதியான திட்டங்களைப் பார்க்கவும்",meets:"வெளியிடப்பட்ட அனைத்து நிபந்தனைகளையும் நீங்கள் பூர்த்தி செய்கிறீர்கள்.",lang:"மொழி",theme:"தோற்றத்தை மாற்று",noRes:"இந்த வடிகட்டியில் திட்டங்கள் இல்லை.",whyNo: "ml": {n:"മലയാളം", e:"Malayalam", dir:"ltr", font:"Noto Sans Malayalam",
 ui:{sub:"നിങ്ങൾക്ക് അർഹതയുള്ള സർക്കാർ പദ്ധതികൾ ഏതൊക്കെയെന്നും അപേക്ഷിക്കാൻ എന്തൊക്കെ കൊണ്ടുപോകണമെന്നും അറിയൂ.",priv:"പേരോ തിരിച്ചറിയൽ കാർഡോ ചോദിക്കില്ല. ഒന്നും നിങ്ങളുടെ ഉപകരണത്തിന് പുറത്തേക്ക് പോകില്ല.",prof:"നിങ്ങളുടെ കുടുംബ പ്രൊഫൈൽ",profHint:"നിങ്ങളെയും കുടുംബത്തെയും കുറിച്ച് ഉത്തരം നൽകൂ. ഫലങ്ങൾ ഉടനെ മാറും.",age:"പ്രായം (വർഷം)",gender:"ലിംഗം",state:"സംസ്ഥാനം / കേന്ദ്രഭരണ പ്രദേശം",occ:"പ്രധാന തൊഴിൽ",area:"താമസ പ്രദേശം",inc:"കുടുംബത്തിന്റെ വാർഷിക വരുമാനം",decl:"അധിക പ്രഖ്യാപനങ്ങൾ",tax:"കുടുംബത്തിൽ ആദായനികുതി അടയ്ക്കുന്ന ആളുണ്ട്",land:"കുടുംബത്തിന് കൃഷിയോഗ്യമായ കൃഷിഭൂമിയുണ്ട്",lpg:"കുടുംബത്തിന് ഇതിനകം സജീവമായ എൽപിജി കണക്ഷനുണ്ട്",reset:"റീസെറ്റ്",allIndia:"അഖിലേന്ത്യ / കേന്ദ്രം",tabYes:"അർഹതയുള്ളവ",tabNo:"അർഹതയില്ലാത്തവ",headN:"{t} പദ്ധതികളിൽ {n} എണ്ണം നിങ്ങളുടെ പ്രൊഫൈലിന് യോജിക്കുന്നു",headNone:"ഈ പ്രൊഫൈലിന് യോജിക്കുന്ന പദ്ധതിയില്ല",tick:"രേഖകൾ ശേഖരിക്കുന്നതനുസരിച്ച് ടിക്ക് ചെയ്യൂ.",noneHint:"“അർഹതയില്ലാത്തവ” എന്നതിൽ കാരണങ്ങൾ കാണൂ. ഏതെങ്കിലും ഉത്തരം മാറ്റിയാൽ ഫലം മാറാം.",how:"എങ്ങനെ അപേക്ഷിക്കാം",docs:"തയ്യാറാക്കി വയ്ക്കേണ്ട രേഖകൾ",ready:"{y} ൽ {x} തയ്യാർ",portal:"ഔദ്യോഗിക പോർട്ടൽ തുറക്കൂ",walkin:"നേരിട്ട് ചെന്നുള്ള രജിസ്ട്രേഷൻ മാത്രം. ഓൺലൈൻ പോർട്ടൽ ഇല്ല.",copy:"ചെക്ക്‌ലിസ്റ്റ് പകർത്തൂ",copied:"പകർത്തി",note:"പ്രസിദ്ധീകരിച്ച മാനദണ്ഡങ്ങളെ അടിസ്ഥാനമാക്കിയുള്ള പ്രാഥമിക പൊരുത്തം. അന്തിമ അനുമതി ഭരണപരമായ പരിശോധനയ്ക്ക് വിധേയമാണ്.",eng:"പദ്ധതി വിവരങ്ങൾ സർക്കാർ പ്രസിദ്ധീകരിച്ച ഇംഗ്ലീഷിൽ തന്നെയാണ്. പേരുകൾ, നിയമങ്ങൾ, കാരണങ്ങൾ എന്നിവ വിവർത്തനം ചെയ്തിട്ടുണ്ട്.",foot:"നിയമങ്ങൾ പരിശോധിക്കുന്നത് നിശ്ചിത ചട്ടക്കൂടാണ്, എഐ അല്ല; അതിനാൽ ഒരേ ഉത്തരങ്ങൾക്ക് എപ്പോഴും ഒരേ ഫലം ലഭിക്കും.",fAll:"എല്ലാം",show:"അപേക്ഷാ രീതി",open:"വിവരങ്ങൾ",viewBar:"അർഹമായ {n} പദ്ധതികൾ കാണൂ",meets:"പ്രസിദ്ധീകരിച്ച എല്ലാ മാനദണ്ഡങ്ങളും നിങ്ങൾ പാലിക്കുന്നു.",lang:"ഭാഷ",theme:"തീം മാറ്റൂ",noRes:"ഈ ഫിൽട്ടറിൽ പദ്ധതികളില്ല.",whyNo:"ഈ പദ്ധതികൾ യോജിക്കാത്തതിന്റെ കാരണങ്ങൾ."},

var STATES = ["All-India / Central", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal", "Andaman and Nicobar Islands", "Chandigarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi (NCT)", "Jammu and Kashmir", "Ladakh", "Lakshadweep", "Puducherry"];
var SCHEMES = JSON.parse(document.getElementById("schemes-data").textContent);
var IDS = ["ayush_hwc_uttarakhand","pm_svanidhi","pmjjby","pmuy_ujjwala_2","naps_2","pm_kisan","pm_jay","pm_mudra_shishu","pmay_g","ssy"];
var OCC = T.en.occ, CAT = T.en.cat, GEN = T.en.g, ARE = T.en.ar, MOD = ["Online","Offline","Hybrid"];
T.en.sch = SCHEMES.map(function(s){return s.name});
var BY = {}; SCHEMES.forEach(function(s){BY[s.id]=s});

function $(id){return document.getElementById(id)}
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fill(s,o){return String(s).replace(/\{(\w+)\}/g,function(_,k){return o[k]!=null?o[k]:""})}
function fmtIN(n){return Number(n).toLocaleString("en-IN")}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

var S = {lang:"en",age:25,gender:"Female",state:STATES[0],occ:"Student",area:"Urban",income:150000,tax:false,land:false,lpg:false,tab:"yes",mode:"all"};
var openSet = {}, checked = {}, firstRender = true, lastN = 0, inView = false, shown = 0;

/* ---------- i18n helpers ---------- */
function t(k){var d=T[S.lang];return (d.ui&&d.ui[k]!=null)?d.ui[k]:T.en.ui[k]}
function lab(field,keys,key){var i=keys.indexOf(key),a=T[S.lang][field];return (a&&a[i])||keys[i]||key}
function occLab(x){if(x==="Thelewala"||x==="Rehriwala")x="Street Vendor";return lab("occ",OCC,x)}
function stateLab(s){if(s===STATES[0])return t("allIndia");if(s==="Uttarakhand")return T[S.lang].st||s;return s}
function schName(s){var i=IDS.indexOf(s.id),a=T[S.lang].sch;return (a&&a[i])||s.name}
function catName(s){var i=CAT.indexOf(s.category),a=T[S.lang].cat;return (a&&a[i])||s.category}
function modeKey(s){var m=s.application_mode||"Online";return m.indexOf("Hybrid")===0?"Hybrid":m}
function modeLab(k){return lab("md",MOD,k)}
function sep(){return S.lang==="ur"?"، ":", "}

/* ---------- rule engine (same order and logic as evaluate_eligibility in app.py) ---------- */
function evaluate(u,s){
  var r=s.rules||{};
  var mn=r.min_age!=null?r.min_age:0, mx=r.max_age!=null?r.max_age:120;
  if(!(mn<=u.age&&u.age<=mx)) return {ok:false,c:0,a:{min:mn,max:mx}};
  if(r.gender_restricted&&u.gender!==r.gender_restricted) return {ok:false,c:1,a:{g:r.gender_restricted}};
  var oc=r.occupations||["Any"];
  if(oc.indexOf("Any")===-1&&oc.indexOf(u.occ)===-1) return {ok:false,c:2,a:{list:oc}};
  var ar=r.area_types||["Rural","Urban","Semi-Urban"];
  if(ar.indexOf(u.area)===-1) return {ok:false,c:3,a:{list:ar}};
  var st=r.eligible_states||["All"];
  if(st.indexOf("All")===-1&&st.indexOf(u.state)===-1&&u.state!==STATES[0]) return {ok:false,c:4,a:{list:st}};
  if(r.max_annual_income!=null&&u.income>r.max_annual_income) return {ok:false,c:5,a:{inc:r.max_annual_income}};
  var taxOk=r.is_tax_payer_allowed==null?true:r.is_tax_payer_allowed;
  if(!taxOk&&u.tax) return {ok:false,c:6,a:{}};
  if(r.requires_landholding&&!u.land) return {ok:false,c:7,a:{}};
  if(r.requires_no_existing_lpg&&u.lpg) return {ok:false,c:8,a:{}};
  return {ok:true};
}
function reasonText(e){
  var d=T[S.lang],a=e.a||{},tpl=(d.r&&d.r[e.c])||T.en.r[e.c];
  var v={min:a.min,max:a.max,inc:a.inc!=null?fmtIN(a.inc):""};
  if(e.c===1) v.g=lab("g",GEN,a.g);
  if(e.c===2) v.list=uniq(a.list.map(occLab)).join(sep());
  if(e.c===3) v.list=a.list.map(function(x){return lab("ar",ARE,x)}).join(sep());
  if(e.c===4) v.list=a.list.map(stateLab).join(sep());
  return fill(tpl,v);
}

/* ---------- build form controls ---------- */
function radios(el,name,keys,lblFn,cur){
  el.innerHTML=keys.map(function(k){
    return '<label class="opt"><input type="radio" name="'+name+'" value="'+esc(k)+'"'+(k===cur?" checked":"")+'><span>'+esc(lblFn(k))+'</span></label>';
  }).join("");
}
function buildOptions(){
  radios($("gender"),"gender",GEN,function(k){return lab("g",GEN,k)},S.gender);
  radios($("area"),"area",ARE,function(k){return lab("ar",ARE,k)},S.area);
  radios($("occ"),"occ",OCC,function(k){return lab("occ",OCC,k)},S.occ);
  var sel=$("state");
  sel.innerHTML=STATES.map(function(s){return '<option value="'+esc(s)+'">'+esc(stateLab(s))+'</option>'}).join("");
  sel.value=S.state;
}
function syncInputs(){
  $("age").value=S.age; $("income").value=S.income; $("incomeR").value=S.income;
  $("incfmt").textContent="₹"+fmtIN(S.income);
  $("tax").checked=S.tax; $("land").checked=S.land; $("lpg").checked=S.lpg;
  $("state").value=S.state;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

$("gender").addEventListener("change",function(e){S.gender=e.target.value;update()});
$("area").addEventListener("change",function(e){S.area=e.target.value;update()});
$("occ").addEventListener("change",function(e){S.occ=e.target.value;update()});
$("state").addEventListener("change",function(e){S.state=e.target.value;update()});
["tax","land","lpg"].forEach(function(id){$(id).addEventListener("change",function(e){S[id]=e.target.checked;update()})});

function setAge(v){S.age=clamp(v,1,110);$("age").value=S.age;update()}
$("ageM").addEventListener("click",function(){setAge(S.age-1)});
$("ageP").addEventListener("click",function(){setAge(S.age+1)});
$("age").addEventListener("input",function(e){var v=parseInt(e.target.value,10);if(!isNaN(v)&&v>=1&&v<=110){S.age=v;update()}});
$("age").addEventListener("change",function(e){var v=parseInt(e.target.value,10);setAge(isNaN(v)?S.age:v)});

function setIncome(v,from){
  S.income=clamp(v,0,3000000);
  if(from!=="num")$("income").value=S.income;
  if(from!=="rng")$("incomeR").value=S.income;
  $("incfmt").textContent="₹"+fmtIN(S.income);
  update();
}
$("incomeR").addEventListener("input",function(e){setIncome(parseInt(e.target.value,10)||0,"rng")});
$("income").addEventListener("input",function(e){var v=parseInt(e.target.value,10);if(!isNaN(v))setIncome(v,"num")});
$("income").addEventListener("change",function(e){var v=parseInt(e.target.value,10);setIncome(isNaN(v)?0:v)});

$("reset").addEventListener("click",function(){
  S.age=25;S.gender="Female";S.state=STATES[0];S.occ="Student";S.area="Urban";S.income=150000;S.tax=S.land=S.lpg=false;
  buildOptions();syncInputs();update();
});

/* ---------- results ---------- */
function setSeal(n){
  var el=$("sealN"),seal=$("seal");
  seal.classList.toggle("zero",n===0);
  if(n===shown)return;
  var from=shown;shown=n;
  if(reduce){el.textContent=n;return}
  seal.classList.remove("pop");void seal.offsetWidth;seal.classList.add("pop");
  var t0=performance.now();
  (function step(now){var p=Math.min(1,(now-t0)/350);el.textContent=Math.round(from+(n-from)*p);if(p<1)requestAnimationFrame(step)})(t0);
}
function prog(id){
  var s=BY[id],n=s.mandatory_documents.length,x=0;
  for(var i=0;i<n;i++)if(checked[id+":"+i])x++;
  return {x:x,n:n,deg:n?Math.round(x/n*360):0};
}
function cardHTML(r){
  var s=r.s,id=s.id,p=prog(id),isOpen=!!openSet[id];
  var docs=s.mandatory_documents.map(function(d,i){
    return '<li><label><input type="checkbox" data-doc="'+i+'"'+(checked[id+":"+i]?" checked":"")+'><span>'+esc(d)+'</span></label></li>';
  }).join("");
  var portal=s.official_portal
    ? '<a class="portal" href="'+esc(s.official_portal)+'" target="_blank" rel="noopener noreferrer">'+esc(t("portal"))+'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></a>'
    : '<p class="walkin">'+esc(t("walkin"))+'</p>';
  return '<article class="card'+(isOpen?" open":"")+'" data-id="'+id+'">'
   +'<button type="button" class="chead" aria-expanded="'+isOpen+'" aria-controls="p-'+id+'">'
   +'<span><span class="cname">'+esc(schName(s))+'</span><span class="ccat">'+esc(catName(s))+'</span></span>'
   +'<span class="cmeta"><span class="mode">'+esc(modeLab(modeKey(s)))+'</span>'
   +'<span class="ring" style="--p:'+p.deg+'deg"><em>'+p.x+'/'+p.n+'</em></span>'
   +'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></button>'
   +'<div class="cpanel" id="p-'+id+'"><div class="cin">'
   +'<p class="meets"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'+esc(t("meets"))+'</p>'
   +'<p class="desc">'+esc(s.description)+'</p>'
   +'<div class="cols"><div><h4>'+esc(t("how"))+'</h4><p>'+esc(s.how_to_apply||"")+'</p>'+portal+'</div>'
   +'<div><h4>'+esc(t("docs"))+'</h4><ul class="docs">'+docs+'</ul><div class="prog">'+esc(fill(t("ready"),{x:p.x,y:p.n}))+'</div>'
   +'<div class="acts"><button type="button" class="copybtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span>'+esc(t("copy"))+'</span></button></div></div></div>'
   +'<p class="note">'+esc(t("note"))+'</p>'
   +'</div></div></article>';
}
function rowHTML(r){
  return '<article class="card no row"><span class="cname">'+esc(schName(r.s))+'</span><span class="why">'+esc(reasonText(r.e))+'</span></article>';
}

function renderResults(){
  var res=SCHEMES.map(function(s){return {s:s,e:evaluate(S,s)}});
  var yes=res.filter(function(r){return r.e.ok}), no=res.filter(function(r){return !r.e.ok});
  var n=yes.length; lastN=n;
  if(firstRender&&yes.length){openSet[yes[0].s.id]=true}
  firstRender=false;

  setSeal(n);
  $("sealT").textContent="/ "+SCHEMES.length;
  $("sumH").textContent=n?fill(t("headN"),{n:n,t:SCHEMES.length}):t("headNone");
  $("sumP").textContent=n?t("tick"):t("noneHint");

  $("tabs").innerHTML=
    '<button type="button" role="tab" data-tab="yes" aria-selected="'+(S.tab==="yes")+'">'+esc(t("tabYes"))+'<span class="cnt">'+yes.length+'</span></button>'+
    '<button type="button" role="tab" data-tab="no" aria-selected="'+(S.tab==="no")+'">'+esc(t("tabNo"))+'<span class="cnt">'+no.length+'</span></button>';
  $("fchips").setAttribute("aria-label",t("show"));
  $("fchips").innerHTML=['all'].concat(MOD).map(function(k){
    return '<button type="button" data-mode="'+k+'" aria-pressed="'+(S.mode===k)+'">'+esc(k==="all"?t("fAll"):modeLab(k))+'</button>';
  }).join("");

  var eng=$("engNote");eng.hidden=S.lang==="en";eng.textContent=t("eng");
  var wn=$("whyNo");wn.hidden=S.tab!=="no";wn.textContent=t("whyNo");

  var src=(S.tab==="yes"?yes:no).filter(function(r){return S.mode==="all"||modeKey(r.s)===S.mode});
  $("list").innerHTML=src.length?src.map(S.tab==="yes"?cardHTML:rowHTML).join(""):'<p class="empty">'+esc(t("noRes"))+'</p>';

  $("mbtn").textContent=fill(t("viewBar"),{n:n});
  updMbar();
}
function update(){renderResults()}
function updMbar(){$("mbar").classList.toggle("show",lastN>0&&!inView)}

$("tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(b){S.tab=b.getAttribute("data-tab");renderResults()}});
$("fchips").addEventListener("click",function(e){var b=e.target.closest("[data-mode]");if(b){S.mode=b.getAttribute("data-mode");renderResults()}});

var list=$("list");
list.addEventListener("click",function(e){
  var h=e.target.closest(".chead");
  if(h){var c=h.parentNode,o=!c.classList.contains("open");c.classList.toggle("open",o);h.setAttribute("aria-expanded",String(o));openSet[c.getAttribute("data-id")]=o;return}
  var b=e.target.closest(".copybtn");
  if(b)copyChecklist(b.closest(".card").getAttribute("data-id"),b);
});
list.addEventListener("change",function(e){
  var i=e.target;
  if(i.matches("input[data-doc]")){
    var c=i.closest(".card"),id=c.getAttribute("data-id");
    checked[id+":"+i.getAttribute("data-doc")]=i.checked;
    var p=prog(id);
    c.querySelector(".ring").style.setProperty("--p",p.deg+"deg");
    c.querySelector(".ring em").textContent=p.x+"/"+p.n;
    c.querySelector(".prog").textContent=fill(t("ready"),{x:p.x,y:p.n});
  }
});
function copyChecklist(id,btn){
  var s=BY[id];
  var lines=[schName(s)].concat(s.mandatory_documents.map(function(d,i){return (checked[id+":"+i]?"[x] ":"[ ] ")+d}));
  if(s.official_portal)lines.push(s.official_portal);
  var span=btn.querySelector("span");
  function done(){span.textContent=t("copied");setTimeout(function(){span.textContent=t("copy")},1600)}
  function fallback(){
    var ta=document.createElement("textarea");ta.value=lines.join("\n");ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta);ta.select();
    try{if(document.execCommand("copy"))done()}catch(err){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lines.join("\n")).then(done,fallback)}else{fallback()}
}

/* mobile jump bar */
$("mbtn").addEventListener("click",function(){$("results").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})});
if("IntersectionObserver" in window){
  new IntersectionObserver(function(en){inView=en[0].isIntersecting;updMbar()},{threshold:0.1}).observe($("results"));
}

/* ---------- language ---------- */
function loadFont(name){
  var id="font-"+name.replace(/\s+/g,"-");
  if(document.getElementById(id))return;
  var l=document.createElement("link");l.id=id;l.rel="stylesheet";
  l.href="https://fonts.googleapis.com/css2?family="+name.replace(/\s+/g,"+")+":wght@400;600;700&display=swap";
  document.head.appendChild(l);
}
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"))});
  $("langBtn").setAttribute("aria-label",t("lang")+": "+T[S.lang].n);
  $("themeBtn").setAttribute("aria-label",t("theme"));$("themeBtn").title=t("theme");
  $("lIncR").textContent=t("inc");
  $("langCur").textContent=T[S.lang].n;
}
function buildLangMenu(){
  $("langMenu").innerHTML=LANG_ORDER.map(function(c){
    var d=T[c];
    return '<button type="button" class="lopt" data-code="'+c+'" lang="'+c+'"'+(c===S.lang?' aria-current="true"':"")+'><span class="ln">'+esc(d.n)+'</span><span class="le">'+esc(d.e)+'</span></button>';
  }).join("");
}
function setLang(code){
  if(!T[code])code="en";
  S.lang=code;var d=T[code],de=document.documentElement;
  de.lang=code;de.dir=d.dir||"ltr";
  de.setAttribute("data-ind",code==="en"?"0":"1");
  if(d.font){de.style.setProperty("--sf",'"'+d.font+'"');loadFont(d.font)}else{de.style.setProperty("--sf",'"Segoe UI"')}
  store("js_lang",code);
  applyI18n();buildOptions();syncInputs();buildLangMenu();renderResults();
}
function closeMenu(focusBtn){
  $("langMenu").hidden=true;$("langBtn").setAttribute("aria-expanded","false");
  if(focusBtn)$("langBtn").focus();
}
$("langBtn").addEventListener("click",function(e){
  e.stopPropagation();
  var open=$("langMenu").hidden;
  $("langMenu").hidden=!open;$("langBtn").setAttribute("aria-expanded",String(open));
  if(open){var cur=$("langMenu").querySelector('[aria-current="true"]');if(cur)cur.focus()}
});
$("langMenu").addEventListener("click",function(e){var b=e.target.closest("[data-code]");if(b){setLang(b.getAttribute("data-code"));closeMenu(true)}});
document.addEventListener("click",function(e){if(!$("langMenu").hidden&&!e.target.closest(".langwrap"))closeMenu(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("langMenu").hidden)closeMenu(true)});

/* ---------- theme ---------- */
function effectiveTheme(){
  var a=document.documentElement.getAttribute("data-theme");
  if(a)return a;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function paintThemeIcon(){
  var dark=effectiveTheme()==="dark";
  $("themeBtn").innerHTML=dark
    ?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    :'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
}
$("themeBtn").addEventListener("click",function(){
  var next=effectiveTheme()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);store("js_theme",next);paintThemeIcon();
});
var savedTheme=load("js_theme");
if(savedTheme==="light"||savedTheme==="dark")document.documentElement.setAttribute("data-theme",savedTheme);
paintThemeIcon();

/* ---------- start ---------- */
var start=load("js_lang");
if(!start||!T[start]){
  var nav=((navigator.language||"en")+"").slice(0,2).toLowerCase();
  start=T[nav]?nav:"en";
}
setLang(start);
})();
</script>

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
